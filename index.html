<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon OTP Keypad</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #172b4d, #050816);
    font-family: Arial, sans-serif;
    color: white;
}

.card {
    width: 320px;
    padding: 30px;
    text-align: center;
    border-radius: 25px;
    background: #101b30;
    box-shadow: 0 0 35px #00c8ff55;
}

h2 { color: #00eaff; }

#display {
    margin: 25px 0;
    font-size: 35px;
    letter-spacing: 12px;
    color: #00ffff;
    text-shadow: 0 0 15px cyan;
}

#keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.key {
    height: 60px;
    font-size: 23px;
    color: white;
    background: linear-gradient(145deg, #243b60, #101a2c);
    border: 1px solid #00bfff55;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 5px 0 #060b15, 0 0 10px #00bfff22;
    transition: 0.15s;
}

.key:hover {
    color: cyan;
    box-shadow: 0 0 18px cyan;
}

.key:active {
    transform: translateY(5px) scale(0.95);
    box-shadow: 0 0 25px cyan;
}

#result {
    margin-top: 20px;
    min-height: 24px;
    font-weight: bold;
}

.shake {
    animation: shake 0.3s;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}
</style>
</head>

<body>

<div class="card" id="card">
    <h2>🔐 OTP Verification</h2>
    <p>Enter demo OTP</p>

    <div id="display">----</div>

    <div id="keypad">
        <button class="key" data-n="1">1</button>
        <button class="key" data-n="2">2</button>
        <button class="key" data-n="3">3</button>
        <button class="key" data-n="4">4</button>
        <button class="key" data-n="5">5</button>
        <button class="key" data-n="6">6</button>
        <button class="key" data-n="7">7</button>
        <button class="key" data-n="8">8</button>
        <button class="key" data-n="9">9</button>
        <button class="key" id="clear">C</button>
        <button class="key" data-n="0">0</button>
        <button class="key" id="enter">✓</button>
    </div>

    <p id="result"></p>
    <small>Demo code: 1234</small>
</div>

<script>
const pad = document.querySelector("#keypad");
const display = document.querySelector("#display");
const result = document.querySelector("#result");
const card = document.querySelector("#card");

let code = "";

function updateDisplay() {
    display.textContent =
        code.padEnd(4, "-").replace(/./g, (c, i) =>
            i < code.length ? "●" : "-"
        );
}

pad.addEventListener("click", e => {
    const key = e.target.closest(".key");
    if (!key) return;

    if (key.id === "clear") {
        code = "";
        result.textContent = "";
        updateDisplay();
        return;
    }

    if (key.id === "enter") {
        if (code.length !== 4) {
            result.textContent = "Enter 4 digits!";
        } else if (code === "1234") {
            result.textContent = "✅ Demo OTP Verified!";
            result.style.color = "#00ff99";
        } else {
            result.textContent = "❌ Incorrect OTP";
            result.style.color = "#ff5555";
            card.classList.add("shake");
            setTimeout(() => card.classList.remove("shake"), 300);
        }
        return;
    }

    if (code.length < 4) {
        code += key.dataset.n;
        updateDisplay();
        result.textContent = "";
    }
});
</script>

</body>
</html>
